<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trafficlites APK Builder</title>
<style>
  :root { color-scheme: dark; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #111417; color: #e6e6e6;
    max-width: 780px; margin: 40px auto; padding: 0 20px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: #8a8f98; margin-bottom: 28px; }
  .row { display: flex; gap: 12px; margin-bottom: 24px; }
  button {
    background: #2b6cee; color: white; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 0.95rem; cursor: pointer;
  }
  button.debug { background: #3a3f47; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status {
    padding: 10px 14px; border-radius: 8px; margin-bottom: 20px;
    font-size: 0.9rem; display: inline-block;
  }
  .status.idle { background: #23262b; }
  .status.running { background: #3a3410; color: #f5c542; }
  .status.success { background: #103a1a; color: #4ade80; }
  .status.failed { background: #3a1010; color: #f87171; }
  pre {
    background: #0b0d0f; border: 1px solid #23262b; border-radius: 8px;
    padding: 14px; height: 340px; overflow-y: auto; font-size: 0.8rem;
    white-space: pre-wrap; word-break: break-word;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid #23262b; font-size: 0.85rem; }
  a.dl { color: #2b6cee; text-decoration: none; }
  h2 { font-size: 1rem; color: #c8c9cc; margin-top: 32px; }
</style>
</head>
<body>
  <h1>Trafficlites APK Builder</h1>
  <div class="sub">Trigger a build, watch it live, grab the APK.</div>

  <div class="row">
    <button id="btnRelease" onclick="build('release')">Build Release</button>
    <button id="btnDebug" class="debug" onclick="build('debug')">Build Debug</button>
  </div>

  <div id="statusBadge" class="status idle">idle</div>

  <pre id="log"></pre>

  <h2>Available APKs</h2>
  <table id="apkTable">
    <thead><tr><th>File</th><th>Size</th><th>Built</th><th></th></tr></thead>
    <tbody></tbody>
  </table>

<script>
const logEl = document.getElementById('log');
const statusEl = document.getElementById('statusBadge');
const btnRelease = document.getElementById('btnRelease');
const btnDebug = document.getElementById('btnDebug');

function setButtons(running) {
  btnRelease.disabled = running;
  btnDebug.disabled = running;
}

async function build(type) {
  const res = await fetch(`/build/${type}`, { method: 'POST' });
  if (!res.ok) {
    const err = await res.json();
    alert(err.error || 'Failed to start build');
    return;
  }
  logEl.textContent = '';
  pollStatus();
  streamLogs();
}

async function pollStatus() {
  const res = await fetch('/status');
  const s = await res.json();
  statusEl.className = 'status ' + s.status;
  statusEl.textContent = s.status + (s.build_type ? ` (${s.build_type})` : '');
  setButtons(s.status === 'running');
  if (s.status === 'running') {
    setTimeout(pollStatus, 1500);
  } else {
    refreshApks();
  }
}

async function streamLogs() {
  const res = await fetch('/logs/stream');
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    logEl.textContent += decoder.decode(value);
    logEl.scrollTop = logEl.scrollHeight;
  }
}

async function refreshApks() {
  const res = await fetch('/apks');
  const apks = await res.json();
  const tbody = document.querySelector('#apkTable tbody');
  tbody.innerHTML = '';
  apks.forEach(a => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${a.name}</td><td>${a.size_mb} MB</td><td>${a.modified}</td>
      <td><a class="dl" href="/download/${a.name}">Download</a></td>`;
    tbody.appendChild(tr);
  });
}

// initial load
pollStatus();
refreshApks();
</script>
</body>
</html>
