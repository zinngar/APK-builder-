services:
  apk-builder-webui:
    image: zinngar/apk-builder-webui:latest
    container_name: apk-builder-webui
    restart: unless-stopped
    ports:
      - "6050:6050"
    environment:
      - PROJECT_DIR=/app
      - OUTPUT_DIR=/app/output
      - PROJECT_SRC_DIR=/app/project_src
      - PORT=6050
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - apk-builder-output:/app/output
      - apk-builder-project-src:/app/project_src
      - apk-builder-gradle-cache:/root/.gradle
      - apk-builder-npm-cache:/root/.npm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6050/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  apk-builder-build:
    image: zinngar/apk-builder-build:latest
    container_name: apk-builder-build
    restart: "no"
    entrypoint: ["/usr/local/bin/build.sh"]
    volumes:
      - apk-builder-project-src:/app
      - apk-builder-output:/app/output
      - apk-builder-gradle-cache:/root/.gradle
      - apk-builder-npm-cache:/root/.npm
    environment:
      - GRADLE_OPTS=-Dorg.gradle.daemon=false
    depends_on:
      apk-builder-webui:
        condition: service_healthy

volumes:
  apk-builder-output:
  apk-builder-project-src:
  apk-builder-gradle-cache:
  apk-builder-npm-cache:

x-casaos:
  displayName: APK Builder
  description: Docker-based React Native/Expo APK builder with Web UI
  icon: https://cdn-icons-png.flaticon.com/512/887/887843.png
  category: Development
  port: 6050
  scheme: http
